name: Executar testes de Selenium
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Conferir ambiente
        run: |
          java -version
          mvn -version
          google-chrome --version
      - name: Executar os dez testes
        run: mvn --batch-mode --no-transfer-progress clean test -Dheadless=true
      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-selenium
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn
